<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haga su reserva - Hotel Rural El Mirador</title>
<style>
body { background-color: #f4efe6; font-family: Arial, sans-serif; margin: 24px; }
h1 { color: blue; }
fieldset { margin-bottom: 18px; padding: 12px; }
label { display: inline-block; margin: 6px 8px 6px 0; }
</style>
</head>
<body>

<h1>Haga su reserva</h1>

<form action="procesareserva.php" method="GET">

<fieldset>
<legend>Datos Personales</legend>
<p>
<label for="nombre">Nombre</label>
<input type="text" id="nombre" name="nombre" required maxlength="100" autofocus>
</p>
<p>
<label for="apellidos">Apellidos</label>
<input type="text" id="apellidos" name="apellidos" required maxlength="100">
</p>
<p>
<label for="dni">DNI</label>
<input type="text" id="dni" name="dni" required maxlength="10" placeholder="DNI con letra">
</p>
</fieldset>

<fieldset>
<legend>Datos de su estancia</legend>
<p>Tipo de habitación:</p>
<p>
<input type="radio" id="individual" name="habitación" value="Individual">
<label for="individual">Individual</label>
<input type="radio" id="doble" name="habitación" value="Doble">
<label for="doble">Doble</label>
<input type="radio" id="triple" name="habitación" value="Triple">
<label for="triple">Triple</label>
</p>
<p>
<label for="personas">Número de personas</label>
<select id="personas" name="personas">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</p>
<p>
<input type="checkbox" id="mascotas" name="mascotas" value="si">
<label for="mascotas">Llevo mascotas</label>
</p>
<p>
<label for="fecha">Fecha de llegada</label>
<input type="date" id="fecha" name="fecha">
</p>
<p>
<label for="hora">Hora de llegada</label>
<input type="time" id="hora" name="hora">
</p>
</fieldset>

<p>
<input type="submit" value="Enviar">
<input type="reset" value="Reiniciar">
</p>

</form>

<p><a href="index.html">Volver</a></p>

</body>
</html>
