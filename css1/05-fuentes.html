<!DOCTYPE html>
<html>
<head>
    <title>Fuentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: blue;
            font-size: 36px;
            font-weight: bold;
            font-family: "Ballet", cursive;
        }

        p {
            text-indent: 30px;
            font-style: italic;
        }

        p.dest {
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.sombra {
            text-shadow: 3px 2px gray;
        }

        p.normal {
            font-style: normal;
        }

<body>
    <h1>Fuentes</h1>

    <p>Bienvenido a FitZone Gym, tu gimnasio para mejorar tu salud y condición física.</p>

    <p class="dest">Entrena cada día, supera tus límites y alcanza tus objetivos.</p>

    <p class="normal">Contamos con instalaciones modernas y profesionales preparados para ayudarte.</p>

</html>
