<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Css en tablas</title>
<style>
  table, td, th { border: 2px solid blue; border-collapse: collapse; }
  table { width: 40%; }
  tr { height: 80px; }
  td { vertical-align: middle; text-align: center; }
  tr:hover { background: grey; }
  tr:nth-child(even) { background: aqua; }
</style>
</head>
<body>
<h1>Css en tablas</h1>
<table>
<tr><th>Artículo</th><th>Precio</th></tr>
<tr><td>Aceite de Oliva</td><td>10.00€</td></tr>
<tr><td>Tortas de Alcázar</td><td>6.50€</td></tr>
<tr><td>Miguelitos de La Roda</td><td>12.00€</td></tr>
</table>
<p><a href="index.html">Volver al índice</a></p>
</body>
</html>
