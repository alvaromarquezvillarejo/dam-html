<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Videotutorial 11: Formularios II (tipos de inputs)</title>
</head>
<body>
<h2>Videotutorial 11: Formularios II (tipos de inputs)</h2>

<form action="procesar.php" method="get">
<p>Texto: <input type="text" name="texto"></p>
<p>Contraseña: <input type="password" name="clave"></p>
<p>Número: <input type="number" name="numero" min="1" max="10"></p>
<p>Fecha: <input type="date" name="fecha"></p>
<p>Hora: <input type="time" name="hora"></p>
<p>Color: <input type="color" name="color"></p>
<p>Rango: <input type="range" name="rango" min="0" max="100"></p>
<p>Casilla: <input type="checkbox" name="acepto" id="acepto"> <label for="acepto">Acepto las condiciones</label></p>
<p>Opción:
<input type="radio" name="opcion" value="a" id="opa"> <label for="opa">A</label>
<input type="radio" name="opcion" value="b" id="opb"> <label for="opb">B</label></p>
<p><label for="comentarios">Comentarios:</label><br>
<textarea id="comentarios" name="comentarios" rows="4" cols="30">Escriba sus comentarios...</textarea></p>
<p><input type="submit" value="Enviar"></p>
</form>

<hr>
<p><a href="index.html">Volver al índice</a></p>
</body>
</html>
