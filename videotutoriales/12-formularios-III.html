<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Videotutorial 12: Formularios III (atributos de formularios)</title>
</head>
<body>
<h2>Videotutorial 12: Formularios III (atributos de formularios)</h2>

<form action="procesar.php" method="get">
<p><label for="nom">Nombre (obligatorio):</label>
<input type="text" id="nom" name="nombre" required placeholder="Escribe tu nombre"></p>
<p><label for="edad">Edad (con valor por defecto):</label>
<input type="number" id="edad" name="edad" value="18" min="0" max="120"></p>
<p><label for="dni">DNI (máximo 10 caracteres):</label>
<input type="text" id="dni" name="dni" maxlength="10"></p>
<p><label for="obs">Observaciones (solo lectura):</label>
<input type="text" id="obs" name="obs" value="Sin observaciones" readonly></p>
<p><label for="buscar">Búsqueda (autofocus):</label>
<input type="search" id="buscar" name="buscar" autofocus></p>
<p><input type="submit" value="Enviar"> <input type="reset" value="Reiniciar"></p>
</form>

<hr>
<p><a href="index.html">Volver al índice</a></p>
</body>
</html>
