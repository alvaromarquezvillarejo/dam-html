<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Videotutorial 9: Tablas</title>
</head>
<body>
<h2>Videotutorial 9: Tablas</h2>
<style>
table, th, td { border: 1px solid black; border-collapse: collapse; }
th, td { padding: 4px 10px; }
</style>
<table>
<tr><th>Nombre</th><th>Edad</th><th>Ciudad</th></tr>
<tr><td>Ana</td><td>23</td><td>Toledo</td></tr>
<tr><td>Luis</td><td>31</td><td>Cuenca</td></tr>
<tr><td>Marta</td><td>27</td><td>Albacete</td></tr>
</table>
<p>Tabla con celda de cabecera combinada (colspan):</p>
<table>
<tr><th colspan="2">Horario de ma&ntilde;ana</th></tr>
<tr><td>Lunes</td><td>HTML</td></tr>
<tr><td>Martes</td><td>CSS</td></tr>
</table>
<p>Tabla con celda combinada en vertical (rowspan):</p>
<table>
<tr><th>M&oacute;dulo</th><th>D&iacute;a</th></tr>
<tr><td rowspan="2">Lenguaje de Marcas</td><td>Lunes</td></tr>
<tr><td>Martes</td></tr>
<tr><td>Sistemas</td><td>Mi&eacute;rcoles</td></tr>
</table>
<hr>
<p><a href="index.html">Volver al &iacute;ndice</a></p>
</body>
</html>
