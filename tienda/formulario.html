<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Formulario de Información - VitalGym</title>
<style>
body {
  background-color: AntiqueWhite;
}
h1 {
  font-size: 25px;
  color: brown;
  font-family: Arial, sans-serif;
}
label {
  font-family: Arial, sans-serif;
  font-size: 18px;
}
</style>
</head>
<body>
<h1>Formulario de Información</h1>
<form action="formulario.php" method="POST">
  <p><label for="nombreyapellidos">Nombre y apellidos:</label><br>
  <input type="text" id="nombreyapellidos" name="nombreyapellidos" maxlength="50"></p>

  <p><label for="contrasena">Contraseña:</label><br>
  <input type="password" id="contrasena" name="contrasena" maxlength="8"></p>

  <p><label for="usuario">Usuario:</label><br>
  <input type="text" id="usuario" name="usuario" value="anónimo" disabled></p>

  <p><label for="nivel">Nivel:</label><br>
  <select id="nivel" name="nivel">
    <option value="basico">Básico</option>
    <option value="medio">Medio</option>
    <option value="avanzado" selected>Avanzado</option>
  </select></p>

  <p><input type="checkbox" id="deseo" name="deseo" checked>
  <label for="deseo">Deseo recibir información por correo electrónico</label></p>

  <p><input type="submit" value="Enviar"></p>
</form>
</body>
</html>
