<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Práctica de vídeo y audio con HTML5: reproducción de contenido multimedia, mapa de Google Maps y visor de PDF.">
<meta name="keywords" content="HTML5, vídeo, audio, multimedia, iframe, Google Maps, PDF">
<meta name="author" content="Álvaro Marquez Villarejo Condés">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<title>Práctica de Vídeo y Audio con HTML5</title>
</head>
<body>

<h1>Práctica de Vídeo y Audio con HTML5</h1>

<h2>Vídeo</h2>
<video controls width="600" height="400">
<source src="video/Publicar20s.webm" type="video/webm">
<source src="video/Publicar20s.mp4" type="video/mp4">
<source src="video/Publicar20s.ogv" type="video/ogg">
Tu navegador no soporta la reproducción de vídeo HTML5.
</video>

<h2>Audio</h2>
<audio controls>
<source src="audio/audio.ogg" type="audio/ogg">
<source src="audio/audio.m4a" type="audio/mp4">
<source src="audio/audio.mp3" type="audio/mpeg">
Tu navegador no soporta la reproducción de audio HTML5.
</audio>

<h2>Cuenca en Google Maps</h2>
<iframe src="https://www.google.com/maps?q=Cuenca,+Espa%C3%B1a&output=embed" width="400" height="300" style="border:0;" allowfullscreen loading="lazy" title="Mapa de Cuenca"></iframe>

<h2>Vídeo de YouTube</h2>
<iframe width="560" height="315" src="https://www.youtube.com/embed/DJJs6iXOU8Y" title="HTML: etiquetas video, audio, favicon, iframe, meta" style="border:0;" allowfullscreen loading="lazy"></iframe>

<h2>Visor de PDF</h2>
<iframe src="documento.pdf" width="600" height="500" title="Visor de PDF"></iframe>

</body>
</html>
